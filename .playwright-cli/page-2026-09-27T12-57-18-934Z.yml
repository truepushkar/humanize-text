                - paragraph [ref=e1041]: "012"
                - heading "Why do other AI detectors sometimes give false positives?" [level=3] [ref=e1043]
              - generic [ref=e1048]:
                - text: Many other AI detectors use metrics like
                - link "perplexity" [ref=e1049] [cursor=pointer]:
                  - /url: /blog/why-perplexity-and-burstiness-fail-to-detect-ai
                - text: to detect AI writing. Perplexity is how unexpected, or surprising, each word in a piece of text is, when looked at from the perspective of a particular language model or LLM. AI text is often low-perplexity, because of how AI models work. Unfortunately, other simple or unsurprising writing, like the Declaration of Independence, come up as a false positive, making perplexity-based detectors unreliable for scenarios like the classroom where false positives are undesirable. Pangram does not use perplexity or other metrics that correlate with AI writing, instead using a comprehensive deep learning approach that discovers patterns over millions of writing samples.
