            - generic [ref=e828]:
              - img "Technical diagram" [ref=e830]
              - paragraph [ref=e833]: Our classifier uses a traditional language model architecture. It receives input text and tokenizes it. Then, the model turns each token into an embedding, which is a vector of numbers representing the meaning of each token. The input is passed through the neural network, producing an output vector. A classifier head transforms the output vector into a prediction of human, AI, or AI-assisted. We train an initial model on a small but diverse dataset of approximately 1 million documents composed of publicly licensed human-written text. The dataset also includes AI-generated text produced by GPT-5 and other frontier language models. The result of training is a neural network capable of reliably predicting whether text was authored by human or AI.
