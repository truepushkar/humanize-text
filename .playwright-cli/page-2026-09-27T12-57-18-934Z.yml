            - generic [ref=e1007]:
              - button [ref=e1008] [cursor=pointer]:
                - paragraph [ref=e1009]: "009"
                - heading "What signals does Pangram use to detect AI text?" [level=3] [ref=e1011]
              - generic: Pangram uses writing style, word choice, syntax choice, and grammatical structure to detect AI writing. Our AI writing detector only looks at the content of the text submitted. It does not compare the text to other submissions in a database or on the web like traditional plagiarism checkers, and it does not capture writing process data such as cut-and-paste. Pangram does not access OpenAI's database or analyze a user's browsing history.
