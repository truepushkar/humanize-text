              - generic [ref=e1005]:
                - text: Pangram detects the latest AI models, including OpenAI's GPT-5.6 and ChatGPT, Anthropic's Claude Opus 5 and Claude Sonnet 5, Google Gemini, xAI's Grok, DeepSeek, and Meta's Llama. Pangram is trained specifically to detect models from these frontier labs and more. We benchmark against 26 models (so far) and they are available to see on our
