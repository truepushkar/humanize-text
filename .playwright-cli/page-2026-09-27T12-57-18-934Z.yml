              - generic: Professors use Pangram to set boundaries on AI use and ensure that students properly learn the material by using our AI and plagiarism detectors directly in their LMS. Academic integrity departments use Pangram to provide evidence for cases that goes beyond the score - highlighting the most common phrases that LLMs use and comparing submissions to actual AI-generated responses.
            - generic [ref=e1039]:
